<table><tr><th>File</th><th>Risk</th><th>Decision</th><th>Status</th><th></th></tr>
{% for d in docs %}<tr><td>{{ d.filename }}</td><td><span class="bar"><i style="width:{{ d.risk_score }}%"></i></span>{{ d.risk_score }}</td>
<td><span class="b {{ d.decision }}">{{ d.decision }}</span></td><td>{{ d.status }}</td><td><a href="/doc/{{ d.doc_id }}">Details</a></td></tr>
{% else %}<tr><td colspan="5" class="mut">Nothing here yet. <a href="/scan">Scan a document</a>.</td></tr>{% endfor %}</table>
